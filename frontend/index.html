<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Inline theme script to prevent flash of unstyled theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>ResuMind AI — ATS Resume Analyzer & Career Optimizer</title>
    <meta name="title" content="ResuMind AI — ATS Resume Analyzer & Career Optimizer" />
    <meta name="description" content="Production-grade ATS resume analyzer. Upload your resume for keyword scoring, grammar review, role matching, and interview preparation with zero data retention." />
    <meta name="keywords" content="ATS resume analyzer, resume score, ATS optimizer, career coach, resume scanner, interview questions, privacy-focused resume review" />
    <meta name="author" content="ResuMind AI" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ResuMind AI — ATS Resume Analyzer & Career Optimizer" />
    <meta property="og:description" content="Production-grade ATS resume analyzer. Instant parsing, role matching, and actionable career advice with zero data retention." />
    <meta property="og:image" content="/icons.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="ResuMind AI — ATS Resume Analyzer & Career Optimizer" />
    <meta property="twitter:description" content="Production-grade ATS resume analyzer. Instant parsing, role matching, and actionable career advice with zero data retention." />
    <meta property="twitter:image" content="/icons.svg" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Typography: Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-surface-bg text-text-main font-sans antialiased min-h-screen transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
